name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Test de bout en bout (Chrome)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    # Non bloquant tant qu'il n'a pas été validé sur les runners GitHub (voir docs/TESTING.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lancer le serveur de prévisualisation
        run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on@8 http://localhost:4173 --timeout 30000
      - name: Trouver Chrome sur le serveur
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "Chrome : $CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - run: npm run test:e2e -- http://localhost:4173/ screenshots
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 7
